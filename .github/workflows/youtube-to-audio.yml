name: YouTube to M4A Audio Converter

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      use_cookies:
        description: 'Use cookies for authentication?'
        required: true
        default: true
        type: boolean

jobs:
  convert-audio:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Deno (JavaScript runtime)
        run: |
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp
      
      - name: Verify secret exists
        id: check_secret
        env:
          COOKIE_SECRET: ${{ secrets.YOUTUBE_COOKIES_BASE64 }}
        run: |
          if [ -n "$COOKIE_SECRET" ]; then
            echo "✅ YOUTUBE_COOKIES_BASE64 secret is set"
            echo "secret_exists=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️ YOUTUBE_COOKIES_BASE64 secret is NOT set"
            echo "secret_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Run conversion with cookies
        if: ${{ github.event.inputs.use_cookies == 'true' && steps.check_secret.outputs.secret_exists == 'true' }}
        env:
          YOUTUBE_COOKIES_BASE64: ${{ secrets.YOUTUBE_COOKIES_BASE64 }}
        run: |
          echo "🔐 Using cookie authentication with Deno"
          python Scripts/convert_audio.py "${{ github.event.inputs.youtube_url }}"
      
      - name: Run conversion without cookies
        if: ${{ github.event.inputs.use_cookies == 'false' || steps.check_secret.outputs.secret_exists == 'false' }}
        run: |
          echo "⚠️ Running without cookie authentication"
          python Scripts/convert_audio.py "${{ github.event.inputs.youtube_url }}"
      
      - name: Upload audio artifacts
        uses: actions/upload-artifact@v4
        with:
          name: converted-audio-files
          path: audio_output/
          retention-days: 30
          if-no-files-found: warn
