name: YouTube to M4A Audio Converter

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      use_cookies:
        description: 'Use cookies for authentication?'
        required: true
        default: true
        type: boolean

jobs:
  convert-audio:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yt-dlp
      
      - name: Verify secret exists
        id: check_secret
        env:
          COOKIE_SECRET: ${{ secrets.YOUTUBE_COOKIES_BASE64 }}
        run: |
          if [ -n "$COOKIE_SECRET" ]; then
            echo "✅ YOUTUBE_COOKIES_BASE64 secret is set"
            echo "secret_exists=true" >> $GITHUB_OUTPUT
            # Show first 20 chars for verification (safe)
            echo "Secret starts with: ${COOKIE_SECRET:0:20}..."
          else
            echo "⚠️ YOUTUBE_COOKIES_BASE64 secret is NOT set"
            echo "secret_exists=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Run conversion with cookies
        if: ${{ github.event.inputs.use_cookies == 'true' && steps.check_secret.outputs.secret_exists == 'true' }}
        env:
          YOUTUBE_COOKIES_BASE64: ${{ secrets.YOUTUBE_COOKIES_BASE64 }}
        run: |
          echo "🔐 Using cookie authentication"
          python Scripts/convert_audio.py "${{ github.event.inputs.youtube_url }}"
      
      - name: Run conversion without cookies
        if: ${{ github.event.inputs.use_cookies == 'false' || steps.check_secret.outputs.secret_exists == 'false' }}
        run: |
          echo "⚠️ Running without cookie authentication"
          python Scripts/convert_audio.py "${{ github.event.inputs.youtube_url }}"
      
      - name: Upload audio artifacts
        uses: actions/upload-artifact@v4
        with:
          name: converted-audio-files
          path: audio_output/
          retention-days: 30
          if-no-files-found: warn
      
      - name: Display success message
        if: success()
        run: |
          echo "🎉 Audio conversion completed successfully!"
          echo "📥 Download the files from the Artifacts section above"
      
      - name: Display failure help
        if: failure()
        run: |
          echo "=========================================="
          echo "❌ Conversion failed!"
          echo "=========================================="
          echo ""
          echo "🔧 Troubleshooting steps:"
          echo ""
          echo "1. Cookie issues:"
          echo "   - Your YOUTUBE_COOKIES_BASE64 secret is set but may be expired"
          echo "   - Export fresh cookies from incognito window"
          echo "   - Update the secret with new base64 value"
          echo ""
          echo "2. Try without cookies first:"
          echo "   - Rerun workflow with 'use_cookies' set to false"
          echo "   - Some public videos work without cookies"
          echo ""
          echo "3. Check video URL:"
          echo "   - Make sure the video exists and is not age-restricted"
          echo "   - Try a different YouTube URL"
          echo "=========================================="
