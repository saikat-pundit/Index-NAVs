name: YouTube to M4A Audio Converter

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      use_cookies:
        description: 'Use cookies for authentication?'
        required: true
        default: true
        type: boolean

jobs:
  convert-audio:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp
    
    - name: Debug - Check cookie secret exists
      run: |
        if [ "${{ secrets.YOUTUBE_COOKIES_BASE64 }}" != "" ]; then
          echo "✅ YOUTUBE_COOKIES_BASE64 secret is set"
          # Show first few characters for verification (safe)
          echo "Secret starts with: ${{ secrets.YOUTUBE_COOKIES_BASE64 }}" | cut -c1-20
        else
          echo "⚠️ YOUTUBE_COOKIES_BASE64 secret is NOT set"
        fi
    
    - name: Run conversion with cookies
      if: ${{ github.event.inputs.use_cookies == 'true' && secrets.YOUTUBE_COOKIES_BASE64 != '' }}
      env:
        YOUTUBE_COOKIES_BASE64: ${{ secrets.YOUTUBE_COOKIES_BASE64 }}
      run: |
        python Scripts/convert_audio.py "${{ github.event.inputs.youtube_url }}"
    
    - name: Run conversion without cookies
      if: ${{ github.event.inputs.use_cookies == 'false' || secrets.YOUTUBE_COOKIES_BASE64 == '' }}
      run: |
        python Scripts/convert_audio.py "${{ github.event.inputs.youtube_url }}"
    
    - name: Upload audio artifacts
      uses: actions/upload-artifact@v4
      with:
        name: converted-audio-files-${{ github.run_id }}
        path: audio_output/
        retention-days: 30
        if-no-files-found: warn
    
    - name: Display success message
      if: success()
      run: |
        echo "🎉 Audio conversion completed!"
        echo "Download the files from the artifacts section above."
    
    - name: Display failure help
      if: failure()
      run: |
        echo "=========================================="
        echo "❌ Conversion failed!"
        echo "=========================================="
        echo ""
        echo "🔧 Troubleshooting steps:"
        echo ""
        echo "1. Check if cookies are expired:"
        echo "   - Open incognito window, log into YouTube"
        echo "   - Export fresh cookies using extension"
        echo "   - Update the YOUTUBE_COOKIES_BASE64 secret"
        echo ""
        echo "2. Try with a different video URL"
        echo ""
        echo "3. If using cookies, try without cookies first"
        echo ""
        echo "4. Check GitHub Secrets:"
        echo "   - Go to Settings → Secrets and variables → Actions"
        echo "   - Verify YOUTUBE_COOKIES_BASE64 exists"
        echo "=========================================="
