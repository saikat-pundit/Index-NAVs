name: YouTube to M4A Audio Converter

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      use_cookie:
        description: 'Use cookie authentication?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  convert-audio:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Run conversion script with cookie
      if: ${{ github.event.inputs.use_cookie == 'true' }}
      env:
        YOUTUBE_COOKIE: ${{ secrets.YOUTUBE_COOKIE }}
      run: |
        python Scripts/convert_audio.py "${{ github.event.inputs.youtube_url }}"
    
    - name: Run conversion script without cookie
      if: ${{ github.event.inputs.use_cookie == 'false' }}
      run: |
        python Scripts/convert_audio.py "${{ github.event.inputs.youtube_url }}"
    
    - name: Upload audio artifacts
      uses: actions/upload-artifact@v4
      with:
        name: converted-audio-files
        path: audio_output/
        retention-days: 30
    
    - name: Debug information
      if: failure()
      run: |
        echo "=========================================="
        echo "Debug Information:"
        echo "=========================================="
        echo "Python version: $(python --version)"
        echo "yt-dlp version: $(yt-dlp --version)"
        echo "FFmpeg version: $(ffmpeg -version | head -n1)"
        echo ""
        echo "Cookie used: ${{ github.event.inputs.use_cookie }}"
        echo "=========================================="
