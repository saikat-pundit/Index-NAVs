name: YouTube to M4A Audio Converter

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL'
        required: true
        type: string
      use_cookies:
        description: 'Use cookies? (Add cookies.txt to repo root)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

jobs:
  convert-audio:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Check for cookies file
      id: check_cookies
      run: |
        if [ -f "cookies.txt" ] && [ "${{ github.event.inputs.use_cookies }}" = "true" ]; then
          echo "cookies_found=true" >> $GITHUB_OUTPUT
          echo "✅ Cookies file found"
        else
          echo "cookies_found=false" >> $GITHUB_OUTPUT
          echo "ℹ️ No cookies file found or cookies not enabled"
        fi
    
    - name: Run conversion script
      env:
        COOKIES_FOUND: ${{ steps.check_cookies.outputs.cookies_found }}
      run: |
        if [ "$COOKIES_FOUND" = "true" ]; then
          echo "Using cookies for authentication..."
        fi
        python Scripts/convert_audio.py "${{ github.event.inputs.youtube_url }}"
    
    - name: Upload audio artifacts
      uses: actions/upload-artifact@v4
      with:
        name: converted-audio-files
        path: audio_output/
        retention-days: 30
    
    - name: Instructions if failed
      if: failure()
      run: |
        echo "=========================================="
        echo "❌ Conversion failed!"
        echo "=========================================="
        echo "To fix this issue:"
        echo ""
        echo "Option 1: Use cookies (recommended)"
        echo "1. Install browser extension 'Get cookies.txt'"
        echo "2. Log into YouTube in your browser"
        echo "3. Export cookies to cookies.txt file"
        echo "4. Add cookies.txt to your repository root"
        echo "5. Re-run workflow with 'use_cookies' set to 'true'"
        echo ""
        echo "Option 2: Try a different video"
        echo "- Some videos are region-restricted or age-restricted"
        echo "- Try a different YouTube URL"
        echo "=========================================="
