name: YouTube to M4A Audio Converter

on:
  workflow_dispatch:
    inputs:
      youtube_url:
        description: 'YouTube Video URL'
        required: true
        type: string

jobs:
  convert-audio:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install yt-dlp
        sudo apt-get update
        sudo apt-get install -y ffmpeg
    
    - name: Run conversion script
      run: |
        python Scripts/convert_audio.py "${{ github.event.inputs.youtube_url }}"
    
    - name: Upload audio artifacts
      uses: actions/upload-artifact@v4
      with:
        name: converted-audio-files
        path: audio_output/
        retention-days: 1
