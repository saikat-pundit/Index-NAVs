name: Fetch Sensibull Cookies

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch-cookies:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Cache Chrome binary
        id: cache-chrome
        uses: actions/cache@v4
        with:
          path: /usr/bin/google-chrome
          key: chrome-120  # Pin a specific version for stability
      
      - name: Install Chrome (only if not cached)
        if: steps.cache-chrome.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      
      - name: Install Python dependencies
        run: pip install selenium webdriver-manager
      
      - name: Fetch cookie and save to Data/cookie.txt
        run: |
          mkdir -p Data
          python Scripts/fetch_cookies.py > Data/cookie.txt
      
      - name: Commit and push updated cookie
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Data/cookie.txt
          git diff --staged --quiet || git commit -m "Update cookie [skip ci]"
          git push
