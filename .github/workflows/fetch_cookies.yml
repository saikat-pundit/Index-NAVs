name: Fetch Sensibull Cookies

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch-cookies:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Cache Chrome
        id: cache-chrome
        uses: actions/cache@v4
        with:
          path: /usr/bin/google-chrome
          key: chrome-latest
      
      - name: Install Chrome (if not cached)
        if: steps.cache-chrome.outputs.cache-hit != 'true'
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      
      - name: Install dependencies with cache
        run: pip install selenium webdriver-manager
      
      - name: Fetch and update cookie
        id: fetch
        run: |
          COOKIE=$(python Scripts/fetch_cookies.py)
          echo "COOKIE=$COOKIE" >> $GITHUB_OUTPUT
          echo "::add-mask::$COOKIE"
      
      - name: Update secret
        uses: azure/publish-secrets-to-github@v1
        with:
          secrets: |
            SENSIBULL_COOKIE: ${{ steps.fetch.outputs.COOKIE }}
          github-token: ${{ secrets.GH_PAT }}
