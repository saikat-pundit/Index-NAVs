name: Fetch Sensibull Cookies

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch-cookies:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python with pip cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Setup Chrome (cached automatically)
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: 'stable'
      
      - name: Install Python dependencies
        run: pip install selenium webdriver-manager
      
      - name: Fetch cookie and save to Data/cookie.txt
        run: |
          mkdir -p Data
          python Scripts/fetch_cookies.py > Data/cookie.txt
      
      - name: Commit and push updated cookie
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Data/cookie.txt
          git diff --staged --quiet || git commit -m "Update cookie [skip ci]"
          git push
