name: Fetch Sensibull Cookies

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  fetch-cookies:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
      
      - name: Cache Chrome
        id: cache-chrome
        uses: actions/cache@v4
        with:
          path: /usr/bin/google-chrome
          key: chrome-latest
      
      - name: Install Chrome (if not cached)
        if: steps.cache-chrome.outputs.cache-hit != 'true'
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      
      - name: Install dependencies
        run: pip install selenium webdriver-manager
      
      - name: Fetch cookie
        id: fetch
        run: |
          COOKIE=$(python Scripts/fetch_cookies.py)
          echo "COOKIE=$COOKIE" >> $GITHUB_OUTPUT
          echo "::add-mask::$COOKIE"
      
      - name: Update GitHub Secret
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const cookieValue = '${{ steps.fetch.outputs.COOKIE }}';
            
            if (!cookieValue || cookieValue.startsWith('ERROR:')) {
              console.log('Invalid cookie value, skipping update');
              return;
            }
            
            try {
              // Get the public key for encryption
              const { data: publicKey } = await github.rest.actions.getRepoPublicKey({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              
              // Encrypt the secret
              const crypto = require('crypto');
              const encryptedCookie = crypto.publicEncrypt(
                {
                  key: publicKey.key,
                  padding: crypto.constants.RSA_PKCS1_OAEP_PADDING,
                },
                Buffer.from(cookieValue)
              ).toString('base64');
              
              // Update the secret
              await github.rest.actions.createOrUpdateRepoSecret({
                owner: context.repo.owner,
                repo: context.repo.repo,
                secret_name: 'SENSIBULL_COOKIE',
                encrypted_value: encryptedCookie,
                key_id: publicKey.key_id,
              });
              
              console.log('✅ Successfully updated SENSIBULL_COOKIE secret');
            } catch (error) {
              console.error('❌ Failed to update secret:', error.message);
              throw error;
            }
