name: Fetch Sensibull Cookies

on:
  schedule:
    # Run every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:  # Allow manual trigger

jobs:
  fetch-cookies:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Chrome browser
        run: |
          sudo apt-get update
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      
      - name: Install Python dependencies
        run: |
          pip install selenium webdriver-manager
      
      - name: Fetch cookies from Sensibull
        id: fetch_cookies
        run: |
          echo "COOKIE_OUTPUT=$(python Scripts/fetch_cookies.py)" >> $GITHUB_OUTPUT
      
      - name: Display cookie in logs
        run: |
          echo "=== COMPLETE COOKIE STRING ==="
          echo "${{ steps.fetch_cookies.outputs.COOKIE_OUTPUT }}"
          echo "=== END COOKIE STRING ==="
