name: Fetch Yandex Disk Files

on:
  # Run manually from GitHub Actions tab
  workflow_dispatch:
  
  # Run automatically on schedule (every 6 hours)
  schedule:
    - cron: '0 */6 * * *'  # Runs at minute 0 of every 6th hour
    
  # Run on push to main branch (for testing)
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  fetch-files:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pandas  # Optional, for better CSV handling
    
    - name: Run file fetcher
      env:
        YANDEX_DISK_TOKEN: ${{ secrets.YANDEX_DISK_TOKEN }}
      run: |
        python Scripts/fetch_disk_files.py
    
    - name: Commit and push CSV files
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add Data/*.csv
        git diff --staged --quiet || git commit -m "Update Yandex Disk files list [skip ci]"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-on-failure:
    runs-on: ubuntu-latest
    needs: fetch-files
    if: failure()
    
    steps:
    - name: Create issue on failure
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Yandex Disk fetch failed',
            body: 'The automated Yandex Disk file fetch has failed. Please check the logs.'
          })
