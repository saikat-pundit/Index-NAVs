name: My Watch List

on:
  schedule:
    - cron: '*/15 2-23 * * 1-5'
  workflow_dispatch:
    inputs:
      triggered_by:
        description: 'Who triggered this workflow'
        required: false
        default: 'manual'
      timestamp:
        description: 'Trigger timestamp'
        required: false

jobs:
  update-csv:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python with CACHE
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies from requirements.txt
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run scripts (continue on failure)
        env:
          YANDEX_EMAIL: ${{ secrets.YANDEX_EMAIL }}
          YANDEX_APP_PASSWORD: ${{ secrets.YANDEX_APP_PASSWORD }}
        run: |
          python Scripts/nseindices.py || true
          python Scripts/nifty50_top10.py || true
          python Scripts/etf_fetch.py || true
          python Scripts/global_data.py || true
          python Scripts/global_commodity.py || true
          python Scripts/eco.py || true
          python Scripts/cash.py || true
          python Scripts/nifty_options.py || true
          python Scripts/fetch_emails.py || true
          python Scripts/BSE.py || true

      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Action"
          git config user.email "action@github.com"
          # Safely add all CSVs in the Data folder. 
          # || true ensures git doesn't crash if the folder is somehow empty
          git add Data/*.csv || true 
          git commit -m "Auto update $(date)" || exit 0
          git push
