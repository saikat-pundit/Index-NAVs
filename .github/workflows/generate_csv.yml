name: Update AERO CSV

on:
  workflow_dispatch: # Manual trigger

permissions:
  contents: write # REQUIRED to commit the file back to the repo

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Processing Script
        run: python Scripts/merge_data.py

      - name: Commit and Push AERO.csv
        run: |
          # Configure Git to identify as the GitHub Action bot
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Add the specific file
          git add Data/AERO.csv
          
          # Commit if there are changes
          # The "|| exit 0" prevents the workflow from failing if there are no changes to commit
          git commit -m "Auto-update: Generated AERO.csv from Google Drive JSON data" || exit 0
          
          # Push changes back to the repository
          git push
