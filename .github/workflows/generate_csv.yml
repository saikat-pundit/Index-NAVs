name: Generate and Release CSV

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  # push:            # Uncomment this to run automatically on every push
  #   branches: [ "main" ]

permissions:
  contents: write # Required to create releases

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run CSV Processing Script
        run: python Scripts/merge_data.py

      - name: Get Current Date
        id: date
        run: echo "date=$(date +'%Y-%m-%d-%H-%M')" >> $GITHUB_OUTPUT

      - name: Create Release and Upload CSV
        uses: softprops/action-gh-release@v1
        with:
          tag_name: data-export-${{ steps.date.outputs.date }}
          name: CSV Data Export ${{ steps.date.outputs.date }}
          files: merged_output.csv
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
