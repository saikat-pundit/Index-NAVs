name: Pending Hearing CSV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Processing Script
        run: python Scripts/merge_data.py

      - name: Commit and Push AERO.csv
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          # Force add the file in Data folder
          git add Data/AERO.csv
          
          # Commit and Push
          git commit -m "Auto-update: Generated AERO.csv from Google Drive Data" || exit 0
          git push
